# Grumi payments tests on the separate local test stack (security review G-12):
# local Supabase (ports 55420-55429) + ATH Móvil simulator (55430), then scripts/test-env-payments.mjs.
# Runs on pushes to dev that touch payments, and by hand (Actions → "Payments test environment" → Run
# workflow, once this file is on main). No secrets are used: everything runs inside the job with fake keys.
name: Payments test environment
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "supabase/functions/payments/**"
      - "supabase/functions/athm-simulator/**"
      - "supabase/migrations/**"
      - "test-env/**"
      - "scripts/test-env*.mjs"
      - ".github/workflows/payments-test-env.yml"
jobs:
  payments-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test stack
        run: npm run test:env:up
      - name: Payments end-to-end tests
        run: npm run test:payments
      - name: Edge Function logs (on failure)
        if: failure()
        run: docker logs supabase_edge_runtime_grumi-test 2>&1 | tail -200 || true
      - name: Stop test stack
        if: always()
        run: npm run test:env:down
