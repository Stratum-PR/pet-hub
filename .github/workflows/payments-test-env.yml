# Grumi payments tests on the separate local test stack (security review G-12):
# local Supabase (ports 55420-55429) + ATH Móvil simulator (55430), then scripts/test-env-payments.mjs.
# Runs on pushes to dev that touch payments, and by hand (Actions → "Payments test environment" → Run
# workflow, once this file is on main). No secrets are used: everything runs inside the job with fake keys.
name: Payments test environment
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "supabase/functions/payments/**"
      - "supabase/functions/athm-simulator/**"
      - "supabase/migrations/**"
      - "test-env/**"
      - "scripts/test-env*.mjs"
      - "src/pages/Register.tsx"
      - ".github/workflows/payments-test-env.yml"
jobs:
  payments-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test stack
        run: |
          set -o pipefail
          npm run test:env:up 2>&1 | tee test-env-up.log
      - name: Payments end-to-end tests
        run: |
          set -o pipefail
          npm run test:payments 2>&1 | tee test-payments.log
      - name: Access-control (RLS) tests
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee test-security.log
      - name: Show the test results as an annotation (readable without opening the log)
        if: success()
        run: |
          msg=$(grep -E "✓|✗|passed|FAILED" test-payments.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Payments checks::$msg"
      - name: Show the failure as an annotation (readable without opening the log)
        if: failure()
        run: |
          for f in test-env-up.log test-payments.log test-security.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done
          docker logs supabase_edge_runtime_grumi-test 2>&1 | tail -60 > edge.log || true
          if [ -s edge.log ]; then
            msg=$(sed -e 's/%/%25/g' edge.log | awk '{printf "%s%%0A", $0}')
            echo "::error title=edge-runtime::$msg"
          fi
      - name: Stop test stack
        if: always()
        run: npm run test:env:down
