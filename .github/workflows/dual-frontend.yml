# Dual-frontend gate (remediation plan P1-13, §9 rule 3). Production (`main`) and the dev page (`dev`) share ONE
# Supabase project, so a migration or Edge Function change must keep both frontends working. Each job starts the
# local test stack from THIS commit's migrations and functions, builds the other ref's frontend against it and runs
# THIS commit's smoke E2E (scripts/test-env-dual.mjs; per-ref expected failures are listed there).
#
# Required status checks (U24). On pull requests the jobs are named `dual-main` and `dual-dev`; those are the names to
# require on `dev` and `main`. No secrets.
#   - No `paths:` filter: a path-filtered workflow never reports on PRs outside its paths, so a required check would
#     wait forever. Every run starts both jobs, and the first step ("Decide") lists the changed files with git. If
#     none matches RELEVANT_PATHS it prints "no migration/function/e2e change; dual-frontend not needed", skips the
#     other steps and the job succeeds in about a minute. Otherwise the full gate runs and can fail the check.
#   - No same-named "skip twin" workflow: with a twin, a PR touching both kinds of paths gets two check runs with
#     the same name, and a quick twin success could stand in for a real failure. Here each job has one check run.
#   - Push and manual runs are named `dual-<ref> (push)` / `dual-<ref> (workflow_dispatch)`, so they never share a
#     name with the PR's required checks (a push run only sees the pushed commits, which can differ from the PR's
#     whole diff, so its quick success must not count for the PR).
#   - Fail-safe: if Decide cannot compute a diff (new branch, force push whose old head is gone, manual run) the full
#     gate runs; if Decide itself errors the job fails (it is never "skipped", which GitHub counts as success).
name: dual-frontend
on:
  push:
    branches: [dev, remediation, "fix/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: dual-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dual:
    name: ${{ github.event_name == 'pull_request' && format('dual-{0}', matrix.ref) || format('dual-{0} ({1})', matrix.ref, github.event_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [main, dev]
    env:
      # What can affect the shared database/functions or this gate (the old `paths:` filter), as an extended regex.
      RELEVANT_PATHS: '^(supabase/migrations/|supabase/functions/|test-env/|e2e/)|^scripts/test-env[^/]*\.mjs$|^playwright\.config\.ts$|^\.github/workflows/dual-frontend\.yml$'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide (did a migration, function, test env or e2e file change?)
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          diffable=false
          case "$EVENT" in
            pull_request)
              # actions/checkout checks out the PR's merge commit; parent 1 is the base tip, so this is the whole PR.
              files=$(git diff --no-renames --name-only HEAD^1 HEAD)
              diffable=true; reason="PR merge commit vs base" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                reason="new branch"
              elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                reason="previous head $BEFORE not available (force push?)"
              else
                files=$(git diff --no-renames --name-only "$BEFORE" HEAD)
                diffable=true; reason="push $BEFORE..$GITHUB_SHA"
              fi ;;
            *)
              reason="$EVENT run" ;;
          esac
          relevant=true
          if [ "$diffable" = true ]; then
            matched=$(printf '%s\n' "$files" | grep -E "$RELEVANT_PATHS" || true)
            if [ -z "$matched" ]; then
              relevant=false
            else
              echo "Relevant changes ($reason):"
              printf '%s\n' "$matched" | sed 's/^/  /'
            fi
          fi
          if [ "$relevant" = true ]; then
            echo "Running the full dual-frontend gate ($reason)."
          else
            echo "no migration/function/e2e change; dual-frontend not needed ($reason)"
            echo "::notice title=dual-${{ matrix.ref }}::no migration/function/e2e change; dual-frontend not needed"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.decide.outputs.relevant == 'true'
      - name: Start test stack (this commit's migrations and functions)
        if: steps.decide.outputs.relevant == 'true'
        id: up
        run: |
          set -o pipefail
          npm run test:env:up 2>&1 | tee test-env-up.log
      - name: Install Playwright browser
        if: steps.decide.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke E2E against ${{ matrix.ref }}'s frontend
        if: steps.decide.outputs.relevant == 'true'
        run: |
          set -o pipefail
          node scripts/test-env-dual.mjs ${{ matrix.ref }} 2>&1 | tee test-dual-${{ matrix.ref }}.log
        env:
          DUAL_WORKDIR: ${{ runner.temp }}/grumi-dual
      - name: Show the failure as an annotation (readable without opening the log)
        if: failure() && steps.decide.outputs.relevant == 'true'
        run: |
          for f in test-env-up.log test-dual-${{ matrix.ref }}.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done
      - name: Upload logs and Playwright report
        if: always() && steps.decide.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dual-${{ matrix.ref }}-report
          path: |
            test-env-up.log
            test-dual-${{ matrix.ref }}.log
            test-results/dual-${{ matrix.ref }}*.json
            reports/e2e-dual-*
            test-results/e2e-dual-*
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop test stack
        if: always() && steps.decide.outputs.relevant == 'true'
        run: npm run test:env:down
